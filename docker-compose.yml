# Multi-instance profile: docker compose --profile multi-instance up -d
# App containers share Postgres + LocalStack; ports 3000/3001/3002.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - lock_timeout=5s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.2
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-sqs.sh"
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    container_name: wagering-api
    profiles: ["app"]
    environment: &app_env
      NODE_ENV: production
      PORT: "3000"
      APP_NAME: wagering-processor
      AUTH_MODE: static
      ALLOW_ANONYMOUS: "true"
      PERSISTENCE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: wagering
      DATABASE_PASSWORD: wagering
      DATABASE_NAME: wagering
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: .
    container_name: wagering-worker
    profiles: ["app", "multi-instance"]
    environment:
      <<: *app_env
    command: ["bun", "run", "src/worker.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # Concurrency demo — three API processes against shared DB/SQS
  api-1:
    build: .
    container_name: wagering-api-1
    profiles: ["multi-instance"]
    environment:
      <<: *app_env
      PORT: "3000"
      APP_NAME: wagering-api-1
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  api-2:
    build: .
    container_name: wagering-api-2
    profiles: ["multi-instance"]
    environment:
      <<: *app_env
      PORT: "3001"
      APP_NAME: wagering-api-2
    ports:
      - "3001:3001"
    command: ["bun", "run", "src/main.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  api-3:
    build: .
    container_name: wagering-api-3
    profiles: ["multi-instance"]
    environment:
      <<: *app_env
      PORT: "3002"
      APP_NAME: wagering-api-3
    ports:
      - "3002:3002"
    command: ["bun", "run", "src/main.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    container_name: wagering-gateway
    profiles: ["multi-instance"]
    ports:
      - "8088:8088"
    volumes:
      - "./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - api-1
      - api-2
      - api-3

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wagering-keycloak
    profiles: ["auth"]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - "./docker/keycloak/realm-jungle-gaming.json:/opt/keycloak/data/import/realm-jungle-gaming.json"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Optional network fault injection — bun run docker:chaos
  # Automated tests do NOT require this; they use unreachable endpoints / short timeouts.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: wagering-toxiproxy
    profiles: ["chaos"]
    ports:
      - "8474:8474"
      - "15432:15432"
      - "14566:14566"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: wagering-prometheus
    profiles: ["obs"]
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: wagering-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3005:3000"
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  localstack_data:
